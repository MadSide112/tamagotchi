<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🐣 Питомец</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;padding:10px 12px;max-width:100%;font:14px/1.35 system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hd b{font-size:15px}
#sg{font-size:12px;color:var(--tg-theme-hint-color);white-space:nowrap}
#pc{display:flex;justify-content:center}
svg{width:170px;height:140px}
.g0,.g1,.g2,.g3,.fc .ec,.fc .zz,.fc .ms,.ac{visibility:hidden}
.s0 .g0,.s1 .g1,.s2 .g2,.s3 .g3,.s4 .g3,.s5 .g3{visibility:visible}
.s0 .fc{visibility:hidden}
.sl .fc .eo{visibility:hidden}.sl .fc .ec,.sl .fc .zz{visibility:visible}
.sad .fc .mh{visibility:hidden}.sad .fc .ms{visibility:visible}
.a-hat .ac-hat,.a-glasses .ac-glasses,.a-bow .ac-bow,.a-scarf .ac-scarf{visibility:visible}
@keyframes br{50%{transform:scale(1.05,.94)}}
@keyframes bb{50%{transform:rotate(3deg)}}
@keyframes bl{95%{transform:scaleY(.06)}}
@keyframes zz{50%{transform:translate(2px,-3px)}}
.bd{animation:br 3.2s ease-in-out infinite;transform-origin:80px 92px}
.eg{animation:bb 2.6s ease-in-out infinite;transform-origin:80px 100px}
.eo{animation:bl 4.4s linear infinite;transform-origin:80px 72px}
.zz{animation:zz 2.4s ease-in-out infinite}
.sr{margin-top:4px}
.lb{display:flex;justify-content:space-between;font-size:12px;color:var(--tg-theme-hint-color)}
.bt{height:5px;margin-top:2px;border-radius:3px;background:var(--tg-theme-secondary-bg-color);overflow:hidden}
.bt i{display:block;height:100%;width:0;border-radius:3px;background:var(--tg-theme-button-color);transition:width .5s}
.low .bt i{background:var(--tg-theme-destructive-text-color)}
.rw{display:flex;gap:6px;margin-top:10px}
.rw button{flex:1;min-width:0;font-size:13px;padding:8px 2px}
#m{min-height:15px;margin-top:7px;text-align:center;font-size:12px;color:var(--tg-theme-hint-color)}
</style>
</head>
<body>
<div class="hd"><b id="nm">Питомец</b><span id="sg"></span></div>
<div id="pc" class="s0">
<svg viewBox="0 0 160 132">
<g fill="#ffd98a" stroke="var(--tg-theme-text-color)" stroke-opacity=".25" stroke-width="1.5">
<g class="eg g0"><path d="M46 52Q46 26 80 26T114 52V82Q114 106 80 106T46 82Z"/><circle cx="66" cy="54" r="4" fill="#ff9d6b" stroke="none"/><circle cx="92" cy="66" r="5" fill="#ff9d6b" stroke="none"/><circle cx="74" cy="86" r="3" fill="#ffb04d" stroke="none"/></g>
<g class="bd g1"><circle cx="58" cy="66" r="7"/><circle cx="102" cy="66" r="7"/><ellipse cx="80" cy="88" rx="32" ry="24"/></g>
<g class="bd g2"><path d="M50 62L44 46L60 54Z"/><path d="M110 62L116 46L100 54Z"/><path d="M116 96Q134 92 130 78" fill="none" stroke="#ffd98a" stroke-opacity="1" stroke-width="7" stroke-linecap="round"/><ellipse cx="80" cy="86" rx="38" ry="28"/></g>
<g class="bd g3"><path d="M48 58L40 40L62 50Z"/><path d="M112 58L120 40L98 50Z"/><path d="M120 94Q140 90 136 72" fill="none" stroke="#ffd98a" stroke-opacity="1" stroke-width="8" stroke-linecap="round"/><ellipse cx="80" cy="84" rx="42" ry="32"/><ellipse cx="80" cy="97" rx="24" ry="11" fill="#ffe9b8" stroke="none"/></g>
<g class="fc">
<g class="eo" fill="var(--tg-theme-text-color)" stroke="none"><circle cx="64" cy="72" r="4.5"/><circle cx="96" cy="72" r="4.5"/></g>
<g class="ec" fill="none" stroke="var(--tg-theme-text-color)" stroke-opacity="1" stroke-width="2.5" stroke-linecap="round"><path d="M58 72Q64 76 70 72"/><path d="M90 72Q96 76 102 72"/></g>
<path class="mh" d="M70 82Q80 90 90 82" fill="none" stroke="var(--tg-theme-text-color)" stroke-opacity="1" stroke-width="2.5" stroke-linecap="round"/>
<path class="ms" d="M70 87Q80 81 90 87" fill="none" stroke="var(--tg-theme-text-color)" stroke-opacity="1" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="52" cy="80" r="5" fill="#ffb3ab" stroke="none"/><circle cx="108" cy="80" r="5" fill="#ffb3ab" stroke="none"/>
<g class="zz" fill="var(--tg-theme-hint-color)" stroke="none" font-weight="700"><text x="112" y="50" font-size="13">z</text><text x="124" y="40" font-size="10">z</text><text x="133" y="32" font-size="8">z</text></g>
</g>
<g class="ac ac-hat" fill="#e67e22" stroke="none"><rect x="50" y="46" width="60" height="7" rx="3"/><rect x="62" y="29" width="36" height="19" rx="4"/></g>
<g class="ac ac-glasses" fill="none" stroke="#7f8c8d" stroke-opacity="1" stroke-width="2.5"><circle cx="64" cy="72" r="8"/><circle cx="96" cy="72" r="8"/><path d="M72 72h16"/></g>
<g class="ac ac-bow" fill="#ff5f8f" stroke="none"><path d="M110 48l14 -8v16z"/><path d="M110 48l-14 -8v16z"/><circle cx="110" cy="48" r="4"/></g>
<g class="ac ac-scarf" fill="#4aa3ff" stroke="none"><rect x="52" y="98" width="56" height="10" rx="5"/><path d="M96 104l6 18h-12z"/></g>
</g>
</svg>
</div>
<div class="sr" id="w1"><div class="lb"><span>Сытость</span><span id="v1">–</span></div><div class="bt"><i id="b1"></i></div></div>
<div class="sr" id="w2"><div class="lb"><span>Настроение</span><span id="v2">–</span></div><div class="bt"><i id="b2"></i></div></div>
<div class="sr" id="w3"><div class="lb"><span>Энергия</span><span id="v3">–</span></div><div class="bt"><i id="b3"></i></div></div>
<div class="rw"><button data-a="feed">🍎 Кормить</button><button data-a="play">🎾 Играть</button><button id="bs" data-a="sleep">😴 Сон</button><button data-a="pet">✋ Гладить</button><button data-a="clean">🛁 Мыть</button></div>
<div id="m"></div>
<script>
const WA=window.Telegram,W=WA?WA.WebApp:null,G=id=>document.getElementById(id),ST=['🥚 Яйцо','🐣 Малыш','😼 Подросток','🎓 Мудрец','✨ Красавец','😈 Хулиган'];
let rv=-1,pn=0;
const btn=[];
if(W){W.ready();W.expand();}
const clamp=v=>Math.max(0,Math.min(100,v|0));
const bar=(k,v)=>{v=clamp(v);G('v'+k).textContent=v+'%';G('b'+k).style.width=v+'%';const w=G('w'+k);if(v<25)w.classList.add('low');else w.classList.remove('low')};
const dr=s=>{G('nm').textContent=s.n||'Питомец';G('sg').textContent=(s.sk?'🤒 ':'')+((ST[s.s]||ST[0])+' · 🪙'+(s.cn|0));const p=G('pc');p.classList.remove('s0','s1','s2','s3','s4','s5','sl','sad','a-hat','a-glasses','a-bow','a-scarf');p.classList.add('s'+(s.s||0));if(s.sl)p.classList.add('sl');if(s.sk||s.h<25||s.m<25)p.classList.add('sad');if(s.wn)p.classList.add('a-'+s.wn);bar('1',s.h);bar('2',s.m);bar('3',s.e);G('bs').textContent=s.sl?'☀️ Бодрить':'😴 Сон'};
const ap=s=>{if(!s||typeof s.r!=='number'||s.r<=rv)return;rv=s.r;dr(s)};
const api=(a,arg)=>fetch('/api/pet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:W?W.initData:'',action:a,arg:arg||''})}).then(r=>r.json());
const send=a=>{if(pn)return;pn=1;btn.forEach(b=>b.disabled=1);G('m').textContent='…';api(a).then(r=>{pn=0;btn.forEach(b=>b.disabled=0);if(r.state)ap(r.state);G('m').textContent=r.message||r.hint||'';if(W&&W.HapticFeedback)W.HapticFeedback.notificationOccurred(r.state?'success':'error')},()=>{pn=0;btn.forEach(b=>b.disabled=0);G('m').textContent='Нет связи с ботом'})};
document.querySelectorAll('.rw button').forEach(b=>{btn.push(b);b.addEventListener('click',()=>send(b.dataset.a))});
api('sync').then(r=>{if(r.state)ap(r.state);G('m').textContent=r.message||r.hint||''}).catch(()=>G('m').textContent='Открой через бота в Telegram 🐣');
setInterval(()=>{if(!pn)api('sync').then(r=>{if(r.state)ap(r.state)}).catch(()=>{})},30000);
</script>
</body>
</html>
